name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours (at minute 0 of hours 0, 6, 12, 18)
    - cron: "0 */6 * * *"
  workflow_dispatch: # This line lets you run it manually to test it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: curl -s -o /dev/null -w "%{http_code}\n" https://dcf-studio.streamlit.app/
